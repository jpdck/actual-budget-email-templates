<!--
  Hourly Receipt Processor -- FAILED
  Subject: Receipt Processor -- FAILED ({{DATE}} {{TIME}})

  Used when step 2 (reaching the receipt mailbox via thunderbird-mail, or reaching
  Actual Budget) fails outright. No emails were scanned in this variant.

  Placeholders to fill in:
    {{DATE}}            -- today's date, e.g. "Jul 27, 2026"
    {{TIME}}             -- run time, e.g. "3:00 PM"
    {{FAILURE_DETAIL}}   -- plain-language description of what couldn't be reached
-->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:640px;margin:0 auto;color:#1f2328;">

  <!-- Status banner -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8d7da;border:1px solid #f1aeb5;border-radius:6px;margin-bottom:20px;">
    <tr>
      <td style="padding:16px 20px;">
        <p style="margin:0;font-size:16px;font-weight:bold;color:#842029;">
          Couldn't get to the mailbox or the budget this run
        </p>
      </td>
    </tr>
  </table>

  <h1 style="font-size:18px;margin:0 0 12px 0;">Receipt Processor</h1>
  <p style="margin:0 0 20px 0;font-size:13px;color:#57606a;">{{DATE}} &middot; {{TIME}}</p>

  <!-- Failure detail -->
  <h2 style="font-size:15px;margin:0 0 8px 0;">What happened</h2>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fff5f5;border:1px solid #f1aeb5;border-radius:6px;margin-bottom:16px;">
    <tr>
      <td style="padding:14px 16px;font-size:14px;line-height:1.5;">
        {{FAILURE_DETAIL}}
      </td>
    </tr>
  </table>

  <p style="margin:0;font-size:13px;color:#57606a;line-height:1.5;">
    No emails were scanned and nothing was touched in your inbox or your budget this
    run. It'll try again next hour.
  </p>

</div>
