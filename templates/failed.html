<!--
  Actual Budget -- Daily Refresh: FAILED
  Subject: Actual Budget -- Daily Refresh: FAILED ({{DATE}})

  Used when step 1 (reaching Actual Budget / opening the budget file) fails outright.
  No categorization is attempted in this variant -- Run Details and item tables are omitted.

  Placeholders to fill in:
    {{DATE}}           -- today's date, e.g. "Jul 26, 2026"
    {{FAILURE_DETAIL}}  -- plain-language description of what check failed / what error occurred
-->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:640px;margin:0 auto;color:#1f2328;">

  <!-- Status banner -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f8d7da;border:1px solid #f1aeb5;border-radius:6px;margin-bottom:20px;">
    <tr>
      <td style="padding:16px 20px;">
        <p style="margin:0;font-size:16px;font-weight:bold;color:#842029;">
          FAILED &mdash; could not reach Actual Budget / open the budget file
        </p>
      </td>
    </tr>
  </table>

  <h1 style="font-size:18px;margin:0 0 12px 0;">Actual Budget &mdash; Daily Refresh</h1>
  <p style="margin:0 0 20px 0;font-size:13px;color:#57606a;">{{DATE}}</p>

  <!-- Failure detail -->
  <h2 style="font-size:15px;margin:0 0 8px 0;">What went wrong</h2>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#fff5f5;border:1px solid #f1aeb5;border-radius:6px;margin-bottom:16px;">
    <tr>
      <td style="padding:14px 16px;font-size:14px;line-height:1.5;">
        {{FAILURE_DETAIL}}
      </td>
    </tr>
  </table>

  <p style="margin:0;font-size:13px;color:#57606a;line-height:1.5;">
    No categorization was attempted this run. The workflow stopped before reading any transaction
    data, so no changes were made to your budget.
  </p>

</div>
